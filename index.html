<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/app/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnlyClinic - Hospital & Patient Registry System</title>
    <!-- Add Inter font directly from Google Fonts for premium feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(event) {
        var errDiv = document.getElementById('runtime-error-overlay') || document.createElement('div');
        errDiv.id = 'runtime-error-overlay';
        errDiv.style.position = 'fixed';
        errDiv.style.bottom = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.backgroundColor = '#ef4444';
        errDiv.style.color = 'white';
        errDiv.style.padding = '20px';
        errDiv.style.zIndex = '999999';
        errDiv.style.fontSize = '14px';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerText = 'Runtime Error: ' + event.message + '\nFile: ' + event.filename + '\nLine: ' + event.lineno + ':' + event.colno + '\nStack: ' + (event.error ? event.error.stack : 'No stack');
        (document.body || document.documentElement).appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.getElementById('runtime-error-overlay') || document.createElement('div');
        errDiv.id = 'runtime-error-overlay';
        errDiv.style.position = 'fixed';
        errDiv.style.bottom = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.backgroundColor = '#991b1b';
        errDiv.style.color = 'white';
        errDiv.style.padding = '20px';
        errDiv.style.zIndex = '999999';
        errDiv.style.fontSize = '14px';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerText = 'Unhandled Rejection: ' + (event.reason ? (event.reason.stack || event.reason.message || event.reason) : 'Unknown reason');
        (document.body || document.documentElement).appendChild(errDiv);
      });
    </script>
  </head>
  <body class="h-full bg-background text-foreground flex overflow-hidden antialiased">
    <div id="root" class="flex h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
